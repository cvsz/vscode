# Vscode Workflow Multi Package Dependency Upgrade

## Action

Follow the multi-package-dependency-upgrade workflow:
1. Identify outdated dependencies in multiple packages/submodules.
2. Update package.json and package-lock.json files in each affected directory.
3. Summarize changes in the commit message, often with tables and changelog links.
4. List all updated dependencies and affected directories.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: */package.json, */package-lock.json, package.json

